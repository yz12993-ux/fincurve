[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fincurve"
version = "0.1.0"
description = "Find which functional form or distribution best characterises financial data, ranked by held-out likelihood."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yuang Zhang" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]
keywords = ["curve fitting", "model selection", "cross-validation", "yield curve", "volatility smile", "quantitative finance"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://yz12993-ux.github.io/fincurve/"
Repository = "https://github.com/yz12993-ux/fincurve"

[tool.setuptools.packages.find]
include = ["fincurve*"]
