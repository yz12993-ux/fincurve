name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install numpy scipy pandas matplotlib setuptools
      - name: Build the C extension in place
        run: python setup.py build_ext --inplace
      - name: Tests with the C extension
        env:
          FINCURVE_REQUIRE_C: "1"
        run: python tests/run_tests.py
      - name: Tests with the NumPy fallback
        env:
          FINCURVE_NO_C: "1"
        run: python tests/run_tests.py
      - name: Package installs and imports
        run: |
          python -m pip install .
          cd /tmp && python -c "import fincurve, fincurve.kernels as k; print(fincurve.__version__, 'C extension:', k.HAVE_C)"
